[workspace]
resolver = "3"
members  = ["crates/*"]
# cargo-fuzz crate with its own workspace
exclude  = ["crates/zstdx-fuzz"]

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
# `is_empty()`/`!is_empty()` state the predicate; clippy's `assert_ne!(x, [] as
# [T; 0])` rewrite reads worse.
assert_is_empty          = "allow"
cargo                    = { level = "warn", priority = -1 }
# The format fixes exact integer bit widths; `as` casts between them are the
# spec, not a smell.
cast_lossless            = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
doc_markdown             = "allow"
# #[inline(always)] is a deliberate perf tool here.
inline_always            = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
missing_safety_doc       = "allow"
multiple_crate_versions  = "allow"
must_use_candidate       = "allow"
pedantic                 = { level = "warn", priority = -1 }
return_self_not_must_use = "allow"
similar_names            = "allow"
unreadable_literal       = "allow"
wildcard_imports         = "allow"

[workspace.lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
codegen-units = 1

# Callgrind attributes counts to source symbols; the gungraun benches need
# them, and stripping must stay off for the same reason.
[profile.bench]
debug = true
strip = false
