[package]
name = "ruzstd"
version = "0.9.1"
rust-version = "1.87"
authors = ["Moritz Borcherding <moritz.borcherding@web.de>"]
edition = "2018"
license = "MIT"
homepage = "https://github.com/KillingSpark/zstd-rs"
repository = "https://github.com/KillingSpark/zstd-rs"
description = "A decoder for the zstd compression format"
exclude = ["decodecorpus_files/*", "dict_tests/*", "fuzz_decodecorpus/*"]
readme = "Readme.md"
keywords = ["zstd", "zstandard", "decompression"]
categories = ["compression"]

[dependencies]
fastrand = {version = "2.3.0", optional = true }
# Compile-time only; the no_std build derives Display/From without the
# std::error::Error impls (mirroring the previous hand-written cfg gates).
thiserror = { version = "2", default-features = false }

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

[dev-dependencies]
# Reference implementation for the in-tree XXH64's tests
twox-hash = { version = "2.0", default-features = false, features = ["xxhash64"] }
criterion = "0.5"
rand = { version = "0.8.5", features = ["small_rng"] }
# zstdmt enables libzstd's worker threads so the bench examples can compare
# the multithreaded encoders against ours
zstd = { version = "0.13.2", features = ["zstdmt"] }

[features]
default = ["hash", "std"]
dict_builder = ["std", "dep:fastrand"]
hash = []
fuzz_exports = []
std = ["thiserror/std"]

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
rustc-dep-of-std = ["dep:core", "dep:alloc"]

[[bench]]
name = "decode_all"
harness = false
