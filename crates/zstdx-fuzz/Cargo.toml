[package]
name    = "zstdx-fuzz"
version = "0.0.1"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"

[[bin]]
name = "decode_dict"
path = "fuzz_targets/decode_dict.rs"

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"

[[bin]]
name = "encode_stream"
path = "fuzz_targets/encode_stream.rs"

[[bin]]
name = "interop"
path = "fuzz_targets/interop.rs"

[[bin]]
name = "huff0"
path = "fuzz_targets/huff0.rs"

[[bin]]
name = "fse"
path = "fuzz_targets/fse.rs"

[dependencies]
libfuzzer-sys = "0.4"
# reference implementation for the interop targets; same binding the
# zstdx-bench crate compares against
zstd          = "0.13.2"

[dependencies.zstdx]
path     = "../zstdx"
features = ["fuzz_exports"]

# Not a workspace member, so the workspace lints are duplicated here.
[lints.clippy]
all                      = { level = "warn", priority = -1 }
# `is_empty()`/`!is_empty()` state the predicate; clippy's `assert_ne!(x, [] as
# [T; 0])` rewrite reads worse.
assert_is_empty          = "allow"
cargo                    = { level = "warn", priority = -1 }
# The format fixes exact integer bit widths; `as` casts between them are the
# spec, not a smell.
cast_lossless            = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
doc_markdown             = "allow"
# #[inline(always)] is a deliberate perf tool here.
inline_always            = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
missing_safety_doc       = "allow"
multiple_crate_versions  = "allow"
must_use_candidate       = "allow"
pedantic                 = { level = "warn", priority = -1 }
return_self_not_must_use = "allow"
similar_names            = "allow"
unreadable_literal       = "allow"
wildcard_imports         = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"
