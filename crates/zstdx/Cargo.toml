[package]
name         = "zstdx"
version      = "0.9.1"
rust-version = "1.89"
authors      = ["Moritz Borcherding <moritz.borcherding@web.de>"]
edition      = "2024"
license      = "MIT"
homepage     = "https://github.com/KillingSpark/zstd-rs"
repository   = "https://github.com/KillingSpark/zstd-rs"
description  = "A decoder for the zstd compression format"
exclude      = ["decodecorpus_files/*", "dict_tests/*"]
readme       = "Readme.md"
keywords     = ["decompression", "zstandard", "zstd"]
categories   = ["compression"]

[dependencies]
fastrand  = { version = "2.3.0", optional = true }
# Compile-time only; the no_std build derives Display/From without the
# std::error::Error impls (mirroring the previous hand-written cfg gates).
thiserror = { version = "2", default-features = false }

alloc = { package = "rustc-std-workspace-alloc", version = "1.0.0", optional = true }
# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
core  = { package = "rustc-std-workspace-core", version = "1.0.0", optional = true }

[dev-dependencies]
# Reference implementation for the in-tree XXH64's tests
twox-hash = { version = "2.0", default-features = false, features = ["xxhash64"] }
# Reference decoder for the interop parts of src/tests (bench tooling lives
# in the zstdx-bench crate)
zstd      = { version = "0.13.2", features = ["zstdmt"] }

[features]
default      = ["hash", "std"]
dict_builder = ["dep:fastrand", "std"]
fuzz_exports = []
hash         = []
std          = ["thiserror/std"]

# Internal feature, only used when building as part of libstd, not part of the
# stable interface of this crate.
rustc-dep-of-std = ["dep:alloc", "dep:core"]

[lints]
workspace = true
