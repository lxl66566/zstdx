[package]
name              = "zstdx-ffi"
version.workspace = true
edition           = "2024"
rust-version      = "1.89"
description       = "libzstd-compatible C ABI (drop-in `libzstd`) over the zstdx codec"
readme            = "../../README.md"
repository        = "https://github.com/lxl66566/zstdx"
license           = "MIT"
keywords          = ["bindings", "compression", "ffi", "zstandard", "zstd"]
categories        = ["compression", "external-ffi-bindings"]

# The cdylib/staticlib artifacts are named `libzstd.so` / `libzstd.a`, so a
# build is directly deployable as a drop-in libzstd (see tests/run-c.sh for
# the soname copy step). The rlib target exists so the crate's own tests can
# link the same symbols they export.
[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name       = "zstd"
path       = "src/lib.rs"

[dependencies]
# hash brings the xxh64 frame checksum (encode + verified decode); the
# set is exactly zstdx's defaults, listed so the ABI surface stays
# explicit if the defaults ever grow.
zstdx = { workspace = true, features = ["hash", "std"] }

[lints]
workspace = true
