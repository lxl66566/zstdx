[package]
name         = "zstdx-cli"
version      = "0.2.1"
edition      = "2024"
rust-version = "1.89"
description  = "A zstd-compatible command line interface built on the pure-Rust zstdx engine"
readme       = "../../README.md"
homepage     = "https://github.com/lxl66566/zstdx"
repository   = "https://github.com/lxl66566/zstdx"
license      = "MIT"
keywords     = ["cli", "compression", "zstandard", "zstd"]
categories   = ["command-line-utilities", "compression"]

[[bin]]
name = "zstdx"
path = "src/main.rs"

[features]
default = ["dict_builder"]
# Dictionary training (`zstdx --train`), on by default for CLI parity with
# zstd's built-in trainer; default-features = false drops it and the flag
# explains itself when missing.
dict_builder = ["zstdx/dict_builder"]

[dependencies]
# Used for the command line binary only
clap               = { version = "4.5.46", features = ["derive"] }
indicatif          = { version = "0.18.0" }
tracing            = { version = "0.1.41" }
tracing-indicatif  = { version = "0.3.13" }
tracing-subscriber = { version = "0.3.20" }
zstdx              = { path = "../zstdx", version = "0.2.1", features = ["std"] }

[lints]
workspace = true
