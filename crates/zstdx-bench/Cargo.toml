[package]
name         = "zstdx-bench"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
description  = "Benchmark and dev-tool harness for the zstdx crate"
publish      = false

[dependencies]
clap  = { version = "4.5", features = ["derive"] }
rayon = "1.12.0"
# zstdmt enables libzstd's worker threads so the benches can compare the
# multithreaded encoders against ours
zstd  = { version = "0.13.2", features = ["zstdmt"] }
zstdx = { path = "../zstdx", features = ["dict_builder"] }

[features]
# Enables `jobdecomp` (encoder-side per-job cost spans). Off by default:
# the span hooks ride the job paths (`cargo run --release -p zstdx-bench
# --features job_trace -- jobdecomp ...`).
job_trace = ["zstdx/job_trace"]
# Enables `seqstats --ref-frame` (decoder-side sequence dump). Off by
# default: the dump hook sits in the decode hot loop, so it must never be
# compiled into timing builds (`cargo run --release -p zstdx-bench --features seq_dump -- seqstats ...`).
seq_dump  = ["zstdx/seq_dump"]

[lints]
workspace = true
