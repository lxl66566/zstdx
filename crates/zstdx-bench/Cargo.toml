[package]
name = "zstdx-bench"
version = "0.1.0"
rust-version = "1.87"
edition = "2021"
publish = false
description = "Benchmark and dev-tool harness for the zstdx crate"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
zstdx = { path = "../zstdx" }
# zstdmt enables libzstd's worker threads so the benches can compare the
# multithreaded encoders against ours
zstd = { version = "0.13.2", features = ["zstdmt"] }
